# Community Hub — SoloHost fully automatic (no form input)
# Image: ghcr.io/cannoi/community-hub:latest
# Public IP is detected at runtime; primary discovery seed is built-in.
services:
  app:
    image: ghcr.io/cannoi/community-hub:latest
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "${HOST_PORT:-8181}:8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - DATA_DIR=/app/data
      # P2P dial port published to the internet (map HOST_PORT → app 8080)
      - P2P_PUBLIC_PORT=${P2P_PUBLIC_PORT:-}
      - HOST_PORT=${HOST_PORT:-8181}
      # Cloudflare directory sync (no hardcoded IP seed)
      - P2P_DIRECTORY_SEEDS=${P2P_DIRECTORY_SEEDS:-https://cannoi-community-bootstrap.huunghitran-datxanh.workers.dev}
      - P2P_FIXED_SEEDS=${P2P_FIXED_SEEDS:-}
      - PRESENCE_SEEDS=${PRESENCE_SEEDS:-}
      - PRESENCE_SERVE=${PRESENCE_SERVE:-true}
      - PRESENCE_ENABLED=true
      - P2P_ENABLED=${P2P_ENABLED:-true}
      - P2P_WS_GATEWAY=${P2P_WS_GATEWAY:-true}
      - P2P_MAX_CONNECTIONS=50
      - P2P_PEER_CRAWL=${P2P_PEER_CRAWL:-true}
      - P2P_CRAWL_PER_CYCLE=${P2P_CRAWL_PER_CYCLE:-4}
      - P2P_MIN_PEERS=${P2P_MIN_PEERS:-3}
      # Bulk content sync keeps only accounts I follow / engage with in the ledger; "all" replicates everything
      - HUB_SYNC_SCOPE=${HUB_SYNC_SCOPE:-interest}
      - HUB_ALLOW_REGISTRATION=false
      - HUB_TRUST_PROXY=false
      # Leave empty — app auto-detects public IP and builds HUB public URL
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - PUBLIC_IP=
    volumes:
      - hub-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hub-data:
